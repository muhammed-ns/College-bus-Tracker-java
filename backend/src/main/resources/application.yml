server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  application:
    name: bus-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bus_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWNvbGxlZ2UtYnVzLXRyYWNrZXItand0LXNlY3JldC1rZXktMjAyNi1zdXBlci1zZWNyZXQ=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  bus:
    stale-threshold-seconds: 30

logging:
  level:
    com.college.bus.tracker: INFO
    org.springframework.security: INFO
